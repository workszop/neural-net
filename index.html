<style>
/* ============================================================
   edulab - Colors & Type foundation
   Fonts (Outfit, IBM Plex Sans, Roboto Mono) load from Google Fonts
   via the <link> tags in tokens/head.html - paste that into <head>.
   No @import here: it chains requests and blocks rendering.
   ============================================================ */

:root {
  /* ---- Brand fonts ---- */
  --font-display: 'Outfit', 'IBM Plex Sans', system-ui, sans-serif;
  --font-sans:    'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono:    'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ============================================================
     RAW COLOR TOKENS
     ============================================================ */

  /* Paper - page background is white; the stone steps are bands / wells.
     Warm neutral grey (no yellow cast) so yellow and the colour blocks stay the
     loudest thing on the page. Stone v2 (2026-10-10) replaced the cream sand
     (#FBF7E6 / #F5EDCB), which at 1.07:1 on white did not read as a surface. */
  --paper:    #FFFFFF;   /* page background (white)                       */
  --paper-2:  #F5F3F0;   /* stone band: alternating sections, card heads   */
  --paper-3:  #EAE6E0;   /* deepest stone: wells, table heads, bar tracks  */
  --surface:  #FFFFFF;   /* cards & sheets                                */

  /* Ink - warm near-black text & lines */
  --ink:      #1C1917;   /* primary text                                    */
  --ink-2:    #44403C;   /* secondary text, 10.3:1 on white                 */
  --ink-3:    #625B53;   /* muted / placeholder: >= 4.5:1 on every paper step */
  --line:     #E0DBD3;   /* hairline: dividers, table rows, card heads      */
  --line-2:   #C9C2B7;   /* stronger: card contours, section rules          */
  --line-strong: #857C69;/* control boundaries (inputs, ghost buttons,
                            answer options): >= 3:1 on paper steps (WCAG 1.4.11) */

  /* ---- Brand: Yellow main · Blue + Green secondary · Red danger ----
     Plain saturated colours. The base colour (--blue) is for large fills,
     illustrations and large text (>= 24px, or 19px bold). "-soft" is the
     solid fill for chips and panels that carry small text: it is the
     AA shade (= "-600"), so its "-ink" (white; dark ink on yellow) reaches
     4.5:1. A colour used AS text goes only on white and uses "-600".
     Never colour-on-colour (no green text on green).
     Gate: python3 scripts/check-contrast.py */

  /* Yellow - primary (buttons, progress, values on dark panels) */
  --yellow:      #FFD500;
  --yellow-600:  #F0C800;  /* hover / press          */
  --yellow-soft: #FFD500;  /* chip / panel fill      */
  --yellow-ink:  #1C1917;  /* text on yellow         */

  /* Blue - secondary (panels, chips, correct / selected state) */
  --blue:      #1E8FC2;
  --blue-600:  #177AA8;
  --blue-soft: #177AA8;   /* = blue-600, white text 4.8:1 */
  --blue-ink:  #FFFFFF;

  /* Green - secondary support (chips, success) */
  --green:      #00A651;
  --green-600:  #078342;  /* hover / press, AA text shade */
  --green-soft: #078342;  /* = green-600, white text 4.9:1 */
  --green-ink:  #FFFFFF;

  /* Red - danger / important / wrong (use sparingly) */
  --red:      #E5322D;
  --red-600:  #C92823;
  --red-soft: #C92823;   /* = red-600, white text 5.5:1 */
  --red-ink:  #FFFFFF;

  /* Grape - 5th category tone (colour-coded groups), from the play palette */
  --grape:      #7A5AC2;
  --grape-soft: #7A5AC2;  /* white text 5.2:1 */
  --grape-ink:  #FFFFFF;

  /* Legacy role aliases - older edulab apps use these names */
  --marigold: var(--yellow); --marigold-600: var(--yellow-600); --marigold-soft: var(--yellow-soft); --marigold-ink: var(--yellow-ink);
  --teal:     var(--blue);   --teal-600:     var(--blue-600);   --teal-soft:     var(--blue-soft);   --teal-ink:     var(--blue-ink);
  --sky:      var(--green);                                     --sky-soft:      var(--green-soft);  --sky-ink:      var(--green-ink);
  --coral:    var(--red);    --coral-600:    var(--red-600);    --coral-soft:    var(--red-soft);    --coral-ink:    var(--red-ink);

  /* Play palette - subject/category colours in the kids app */
  --play-sun:    #FFD500;
  --play-grass:  #00A651;
  --play-berry:  #C6478B;
  --play-grape:  #7A5AC2;
  --play-sky:    #1E8FC2;
  --play-coral:  #E5322D;

  /* ---- Semantic ---- */
  --success:      #00A651;  --success-soft: #078342;  --success-ink: #FFFFFF;
  --warning:      #FFD500;  --warning-soft: #FFD500;  --warning-ink: #1C1917;
  --danger:       #E5322D;  --danger-soft:  #C92823;  --danger-ink:  #FFFFFF;
  --info:         #1E8FC2;  --info-soft:    #177AA8;  --info-ink:    #FFFFFF;

  /* ---- Functional aliases ---- */
  --bg:        var(--paper);
  --fg:        var(--ink);
  --fg-muted:  var(--ink-2);
  --primary:   var(--yellow);
  --on-primary:#1C1917;      /* dark text on yellow */
  /* White gap + ink band: >= 3:1 on paper, sand, yellow and every chip fill.
     Pair with `outline: 3px solid transparent` so forced-colours mode still shows focus. */
  --focus-ring: 0 0 0 2px var(--paper), 0 0 0 5px var(--ink);
  /* Range-slider track */
  --track: color-mix(in srgb, var(--ink) 24%, transparent);

  /* ============================================================
     SPACING  (4pt base)
     ============================================================ */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  --sp-12: 48px; --sp-16: 64px; --sp-20: 80px; --sp-24: 96px;

  /* ---- Radii (friendly, generous) ---- */
  /* Page gutter (user decision 2026-11-07): content ~70% of the viewport on wide screens
     (15% margin each side from ~1280px), never squeezed below 900px, 16-72px on phones/tablets.
     Every full-width band, header row, page head and footer pads its content with it. */
  --gutter: max(clamp(16px, 4vw, 72px), min(15vw, calc((100vw - 900px) / 2)));
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

  /* ---- Elevation - warm, low, soft ---- */
  --shadow-sm: 0 1px 2px rgba(33,30,26,.10), 0 2px 6px rgba(33,30,26,.06);
  --shadow-md: 0 6px 18px rgba(33,30,26,.12), 0 1px 3px rgba(33,30,26,.08);
  --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);
  --shadow-primary:  0 8px 22px color-mix(in srgb, var(--yellow) 30%, transparent);
  --shadow-marigold: var(--shadow-primary);   /* legacy alias */

  /* ============================================================
     TYPE SCALE (semantic sizes)
     ============================================================ */
  --display-font:  clamp(48px, 6vw, 72px);
  --h1: 44px; --h2: 33px; --h3: 25px; --h4: 19px;
  --body-lg: 18px; --body: 16px; --body-sm: 14px;
  --caption: 13px; --overline: 12px;
}

/* ============================================================
   SEMANTIC ELEMENT STYLES
   Apply via element selectors or .edu-prose wrapper.
   Element defaults are wrapped in :where(.edu) (zero specificity) so any
   single class wins: <p class="edu-overline">, <p class="edu-small">,
   <h1 class="app-title"> keep their own font/size instead of the element default.
   ============================================================ */

.edu-display, :where(.edu) h1.display {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--display-font);
  line-height: 1.02;
  letter-spacing: -0.025em;
  color: var(--ink);
}
:where(.edu) h1, .edu-h1 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h1);
  line-height: 1.06; letter-spacing: -0.02em; color: var(--ink);
}
:where(.edu) h2, .edu-h2 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h2);
  line-height: 1.12; letter-spacing: -0.015em; color: var(--ink);
}
:where(.edu) h3, .edu-h3 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h3);
  line-height: 1.2; letter-spacing: -0.01em; color: var(--ink);
}
:where(.edu) h4, .edu-h4 {
  font-family: var(--font-sans);
  font-weight: 700; font-size: var(--h4);
  line-height: 1.3; color: var(--ink);
}
:where(.edu) p, .edu-p, .edu-body {
  font-family: var(--font-sans);
  font-weight: 400; font-size: var(--body);
  line-height: 1.6; color: var(--ink-2);
}
.edu-body-lg { font-family: var(--font-sans); font-size: var(--body-lg); line-height: 1.6; color: var(--ink-2); }
.edu-small  { font-family: var(--font-sans); font-size: var(--body-sm); line-height: 1.5; color: var(--ink-2); }
.edu-caption{ font-family: var(--font-sans); font-size: var(--caption); line-height: 1.45; color: var(--ink-3); }

/* Overline - mono, tracked; functional labels only (never above page/section titles) */
.edu-overline {
  font-family: var(--font-mono);
  font-weight: 500; font-size: var(--overline);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink);
}
:where(.edu) code, .edu-mono {
  font-family: var(--font-mono);
  font-size: 0.92em; color: var(--ink);
  background: var(--paper-3); padding: 0.12em 0.4em; border-radius: var(--r-xs);
}

/* Solid colour blocks (callouts, stat cards, chips): set background: var(--X-soft) and
   color: var(--X-ink) on the block, add .edu-block, and every heading/paragraph inside
   inherits that text colour instead of the default ink. */
.edu-block, .edu-block h1, .edu-block h2, .edu-block h3, .edu-block h4, .edu-block p,
.edu-block li, .edu-block small { color: inherit; }

body.edu { background: var(--paper); color: var(--ink); font-family: var(--font-sans); }

</style>
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; padding: 0; }
:focus-visible { outline: 3px solid transparent; outline-offset: 2px; box-shadow: var(--focus-ring); }
button { font: inherit; }

/* ── Top menu ── */
.edu-header { position: sticky; top: 0; z-index: 50; width: 100%; background: var(--paper); border-bottom: 1px solid var(--line-2); }
.edu-header-inner { padding: 4px var(--gutter); display: flex; align-items: center; gap: 12px; }
.edu-logo { width: 64px; height: 64px; display: block; margin-right: -6px; }
.edu-wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }
.view-seg { margin-left: 14px; }
.view-seg button { font-size: 15px; white-space: nowrap; }
[data-view-panel][hidden] { display: none; }
.head-tools { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.edu-seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--paper-2); border-radius: var(--r-pill); }
.edu-seg button { border: none; background: transparent; padding: 7px 14px; border-radius: var(--r-pill);
  font-family: var(--font-sans); font-weight: 600; color: var(--ink-2); cursor: pointer; }
.edu-seg button.active { background: var(--yellow); color: var(--yellow-ink); }
.pill-toggle { border: 1px solid var(--line-strong); background: transparent; color: var(--ink); border-radius: var(--r-pill);
  padding: 7px 16px; font-family: var(--font-display); font-weight: 600; cursor: pointer; }
.pill-toggle[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow); color: var(--yellow-ink); }

/* ── Page head ── */
.page-head { padding: 16px var(--gutter) 12px; text-align: left; }
.app-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.8rem, 2.6vw, 2.7rem);
  letter-spacing: -.025em; line-height: 1.05; color: var(--ink); margin: 0 0 8px; }
.edu-lead { font-size: 1rem; line-height: 1.5; color: var(--ink-2); margin: 0; }

main { padding: 0 var(--gutter) 20px; position: relative; }

/* ── Hints (overlay drawer so it never pushes status below 768px) ── */
.hints { position: absolute; left: var(--gutter); right: var(--gutter); top: 4px; z-index: 30;
  background: var(--yellow-soft); color: var(--yellow-ink); border: 2px solid var(--ink);
  border-radius: var(--r-md); padding: 14px 44px 14px 20px; box-shadow: var(--shadow-lg); }
.hints[hidden] { display: none; }
.hints-close { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: var(--r-pill);
  border: 1px solid var(--ink); background: var(--paper); color: var(--ink); font-size: 16px; line-height: 1;
  display: grid; place-items: center; cursor: pointer; }
.hints-close:hover { background: var(--paper-3); }
.hints ol { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 22px; counter-reset: h; }
.hints li { counter-increment: h; font-size: 14.5px; line-height: 1.4; display: flex; gap: 10px; }
.hints li::before { content: counter(h); flex: none; width: 24px; height: 24px; border-radius: var(--r-pill);
  background: var(--ink); color: var(--yellow); font-family: var(--font-mono); font-size: 13px; display: grid; place-items: center; }
.hints p { margin: 10px 0 0; font-size: 13.5px; color: inherit; }

/* ── Card ── */
.card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
.card-head { padding: 8px 14px; background: var(--paper-2); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-head .edu-overline { margin: 0; letter-spacing: .04em; font-size: 11px; }
.card-head .edu-seg { background: var(--paper-3); }
.card-head .edu-seg button { padding: 6px 11px; font-size: 15px; }
.card-head .spacer { flex: 1; }
.btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r-pill);
  padding: 7px 13px; font-size: 15px; font-family: var(--font-display); font-weight: 600; cursor: pointer; }
.btn-ghost:hover { background: var(--paper-3); }
.edu-btn { border: none; font-family: var(--font-display); font-weight: 600; background: var(--yellow); color: var(--on-primary);
  border-radius: var(--r-pill); padding: 8px 15px; font-size: 15px; cursor: pointer; }
.edu-btn:hover { background: var(--yellow-600); }
.step-count { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.scroll-hint { display: none; margin: 8px 14px 0; padding: 6px 12px; border-radius: var(--r-pill);
  background: var(--paper-2); border: 1px solid var(--line-2); color: var(--ink-2);
  font-family: var(--font-mono); font-size: 11.5px; align-items: center; justify-content: center; gap: 6px;
  transition: opacity .25s ease; }
.scroll-hint.seen { opacity: .45; }
.graph-shell { position: relative; }
.graph-wrap { padding: 8px 14px 2px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.graph-legend { padding: 2px 16px 8px; font-size: 12.5px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.graph-legend .dot-sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }
.graph-legend .dot-pos { background: var(--blue-600); }
.graph-legend .dot-neg { background: var(--red-600); }
#graph, #lmGraph { display: block; width: 100%; height: auto; min-width: 780px; user-select: none; -webkit-user-select: none; }

/* ── Status strip ── */
.status { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; padding: 10px 14px 12px; border-top: 1px dashed var(--line-2); }
.st { border: 2px solid var(--line-2); border-radius: var(--r-md); padding: 7px 12px; display: flex; align-items: center; gap: 12px;
  background: var(--surface); text-align: left; color: var(--ink); min-width: 0; }
button.st { cursor: pointer; }
button.st[aria-pressed="true"] { border-color: var(--ink); }
.st svg { flex: none; width: 44px; height: 44px; border-radius: var(--r-xs); border: 1px solid var(--line-2); }
.st .txt { min-width: 0; flex: 1; }
.st .l1 { font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.st .l2 { font-family: var(--font-display); font-weight: 600; font-size: 16px; line-height: 1.25; }
.chip { flex: none; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  padding: 4px 10px; border-radius: var(--r-pill); white-space: nowrap; }
.chip.bad { background: var(--red-soft); color: var(--red-ink); }
.chip.mid { background: var(--yellow-soft); color: var(--yellow-ink); }
.chip.ok  { background: var(--green-soft); color: var(--green-ink); }
.chip.info { background: var(--blue-soft); color: var(--blue-ink); }
.chip.untrain { background: var(--paper-3); color: var(--ink-2); }
.chip[hidden] { display: none; }
.st .l3 { display: block; margin-top: 3px; font-size: 12px; line-height: 1.35; color: var(--ink-2); }
.st .l3:empty { display: none; }
.status[hidden] { display: none; }
.st.note { font-size: 13px; line-height: 1.4; color: var(--ink-2); background: var(--paper-2); }
.card-head .pill-toggle { padding: 7px 13px; font-size: 15px; background: var(--surface); }
.card-head .pill-toggle[aria-pressed="true"] { background: var(--yellow); }
.st.loss { flex-direction: column; align-items: stretch; gap: 3px; }
.st.loss .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.st.loss .val { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1; }
.meter { height: 8px; border-radius: var(--r-pill); background: var(--paper-3); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: var(--r-pill); }
.st.loss .goal { font-size: 12.5px; color: var(--ink-2); line-height: 1.35; }
.st.loss.done { background: var(--green-soft); border-color: var(--green-soft); color: var(--green-ink); }
.st.loss.done .l1, .st.loss.done .goal { color: inherit; }
.st.loss.done .meter { background: var(--paper); }
.st.loss.done .meter i { background: var(--paper); }

/* ── SVG graph ── */
.graph text { font-family: var(--font-mono); fill: var(--ink); }
.graph .disp { font-family: var(--font-display); font-weight: 700; }
.graph .muted { fill: var(--ink-3); }
.graph .col-chip rect { rx: 10px; }
.graph .col-chip text { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.c-grape rect { fill: var(--grape-soft); } .c-grape text { fill: var(--grape-ink) !important; }
.c-ink rect { fill: var(--ink); } .c-ink text { fill: var(--paper) !important; }
.c-yellow rect { fill: var(--yellow-soft); } .c-yellow text { fill: var(--yellow-ink) !important; }
.c-blue rect { fill: var(--blue-soft); } .c-blue text { fill: var(--blue-ink) !important; }
.graph .frame { fill: none; stroke: var(--grape); stroke-width: 2; }
.graph .tcell { stroke: var(--line); stroke-width: 1; }
.graph .tnum { font-size: 9.5px; text-anchor: middle; pointer-events: none; }
.graph .dim { opacity: .28; }
.graph .mark-pos { stroke: var(--blue-600); stroke-width: 2.5; }
.graph .mark-neg { stroke: var(--red-600); stroke-width: 2.5; }
.graph .arrow { stroke: var(--ink); stroke-width: 2; fill: none; }
.graph .fan { fill: var(--paper-3); stroke: var(--line-2); stroke-width: 1; opacity: .55; }
.graph .fan.on { fill: var(--yellow); stroke: var(--ink); opacity: .8; }
.graph .hbox { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.graph .hid { cursor: pointer; outline: none; }
.graph .hid.on .hbox { fill: var(--yellow); }
.graph .hid:focus-visible .hbox { stroke-width: 4; }
.graph .w-pos { fill: var(--blue-600); } .graph .w-neg { fill: var(--red-600); } .graph .w-zero { fill: var(--paper-3); }
.graph .hm { stroke: var(--surface); stroke-width: .5; }
.graph .edge { fill: none; stroke-linecap: round; transition: opacity .15s ease; }
.graph .edge.pos { stroke: var(--blue-600); } .graph .edge.neg { stroke: var(--red-600); }
.graph .edge.zero { stroke: var(--line-strong); stroke-dasharray: 4 5; }
.graph .edge.dimmed { opacity: .16; }
.graph .edge.lit { opacity: 1; }
.graph .knob { cursor: ns-resize; outline: none; touch-action: none; }
.graph .knob:active { cursor: grabbing; }
.graph .knob.dimmed { opacity: .35; }
.graph .knob.lit .body { fill: var(--yellow); stroke: var(--ink); stroke-width: 2.5; }
.graph .line-hl { fill: var(--yellow); opacity: 0; rx: 4; transition: opacity .12s ease; }
.graph .line-hl.on { opacity: .9; }
.graph .hid.lit .hbox { stroke: var(--ink); stroke-width: 3.5; fill: var(--paper-2); }
.graph .knob .body { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.5; }

      .sort((a, b) => b.frac - a.frac || b.v - a.v || a.i - b.i);

  // knobs (on top)

}

function buildLmGraph() {

  for (let k = 0; k < LM_V; k++) {
    const x = LG.inb.x + 17 + k * 14;

    lmRefs.ohn.push(el('text', { class: 'ohn', x: x + 7, y: top + 109 }, lmGraph));
  }
  el('text', { class: 'muted', x: mid, y: top + LG.inb.h + 16, 'text-anchor': 'middle', 'font-size': 10.5, 'data-i18n': 'lmInCap' }, lmGraph);

  // output rows
  LG.row.ys.forEach((y, k) => {
    const g = el('g', { class: 'row', 'data-k': k }, lmGraph), r = LG.row;
    el('rect', { class: 'rbox', x: r.x, y: y - r.h / 2, width: r.w, height: r.h, rx: 10 }, g);
    const word = el('text', { class: 'disp', x: r.x + 14, y: y + 5, 'font-size': 15 }, g);
    el('rect', { class: 'bar-track', x: LG.bar.x, y: y - 4, width: LG.bar.w, height: 8, rx: 4 }, g);
    const bar = el('rect', { class: 'bar-fill', x: LG.bar.x, y: y - 4, width: 0, height: 8, rx: 4 }, g);
    const prob = el('text', { class: 'disp', x: LG.bar.x + LG.bar.w + 48, y: y + 5, 'font-size': 15, 'text-anchor': 'end' }, g);
    const tag = el('text', { class: 'tag', x: r.x + r.w - 10, y: y + 4 }, g);

  });

  // knobs (on top)
  LG.row.ys.forEach((y, k) => lmRefs.knobs.push(makeKnob(lmGraph, LG.knob.x, y, LG.knob.r, LM_W_MAX, { class: 'knob sm', 'data-k': k })));
}
function layoutLmText() {
  const g = lmRefs.textG;
  g.innerHTML = ''; lmRefs.toks = [];
  LM_TEXT.forEach((id, i) => {
    if (i % LM_SENT_LEN === 0) layoutLmText.x = LG.text.x + 1;
    const w = lmWord(id), bw = Math.round(w.length * 8 + 20), y = LG.text.ys[Math.floor(i / LM_SENT_LEN)];
    const pairIdx = LM_PAIR_POS.indexOf(i);
    const tok = el('g', pairIdx < 0
      ? { class: 'tok last', 'data-pos': i }
      : { class: 'tok', tabindex: 0, role: 'button', 'data-pos': i, 'data-pair': pairIdx }, g);
    el('rect', { x: layoutLmText.x, y: y - LG.text.h / 2, width: bw, height: LG.text.h, rx: 8 }, tok);
    el('text', { x: layoutLmText.x + bw / 2, y: y + 4.5 }, tok, w);
    if (i % LM_SENT_LEN > 0) {   // answer word: a bar shows the chance the model gives it
      el('rect', { class: 'fit-track', x: layoutLmText.x, y: y + LG.text.h / 2 + 2, width: bw, height: 4, rx: 2 }, g);
      tok.fit = el('rect', { class: 'fit', x: layoutLmText.x, y: y + LG.text.h / 2 + 2, width: 0, height: 4, rx: 2 }, g);
      tok.fitW = bw;
    }

    lmRefs.toks.push(tok);
  });
}

function render() {
  const f = forward(state.face, state.W), px = FACES[state.face].px;
  const active = state.focusHidden !== null ? state.focusHidden : state.pinnedHidden;

  // image + tensor
  for (let j = 0; j < 64; j++) {
    refs.img[j].setAttribute('fill', grey(px[j]));
    const c = refs.tcell[j], n = refs.tnum[j];

      const w = HIDDEN[active].w[j];

  }

    refs.cap.textContent = t('hiddenCap', { id: HIDDEN[active].id, pre: fmt(f.hid[active].pre), a: fmt(f.h[active]) });
  } else refs.cap.textContent = t('tensorCap');

  // hidden
  const fk = state.focusKnob;
  HIDDEN.forEach((n, i) => {
    refs.hval[i].textContent = fmt(f.h[i]);
    refs.hid[i].classList.toggle('on', active === i);
    refs.hid[i].classList.toggle('lit', fk !== null && fk.i === i);
    refs.hid[i].setAttribute('aria-pressed', state.pinnedHidden === i);

    refs.fans[i].setAttribute('class', 'fan' + (active === i ? ' on' : ''));
  });

  // edges + knobs
  HIDDEN.forEach((n, i) => OUT.forEach((o, k) => {
    const w = state.W[i][k], sc = signClass(w), kn = refs.knobs[i][k], R = G.knobR;
    const e = refs.edges[i][k];
    const isLit = fk !== null && fk.i === i && fk.k === k;
    const isDim = fk !== null && !isLit;
    e.setAttribute('class', 'edge ' + sc + (isLit ? ' lit' : isDim ? ' dimmed' : ''));
    e.setAttribute('stroke-width', (sc === 'zero' ? 1.5 : 1.5 + Math.abs(w) * 3) + (isLit ? 1.5 : 0));
    kn.g.classList.toggle('lit', isLit);
    kn.g.classList.toggle('dimmed', isDim);
    drawKnob(kn, w, W_MAX, R, 2);
    kn.g.setAttribute('aria-label', t('knob', { h: n.id, o: t(o) }));
  }));

  // outputs
  const label = FACES[state.face].label;
  const outPcts = pctList(f.p);
  OUT.forEach((o, k) => {
    const r = refs.outs[k];
    r.prob.textContent = outPcts[k];
    r.bar.setAttribute('width', Math.max(0, (G.out.w - 28) * f.p[k]));
    HIDDEN.forEach((n, i) => {
      const w = state.W[i][k], sc = signClass(w);
      r.lineHls[i].classList.toggle('on', fk !== null && fk.i === i && fk.k === k);
      r.lines[i].innerHTML = '';
      el('tspan', { class: 'muted' }, r.lines[i], n.id + '  ');
      el('tspan', {}, r.lines[i], fmt(f.h[i]) + ' × ');
      el('tspan', { class: sc === 'zero' ? '' : 't-' + sc }, r.lines[i], fmt(w));
      el('tspan', {}, r.lines[i], ' = ');
      el('tspan', { class: 'b' }, r.lines[i], fmt(f.h[i] * w));
    });
    r.sum.textContent = `${t('sum')} z = ${fmt(f.z[k])}`;
    r.soft.textContent = `${t('softCap')} → ${outPcts[k]}`;
    const isPred = f.pred === k;
    r.g.setAttribute('class', 'out' + (isPred ? (k === label ? ' good' : ' wrong') : ''));
  });

  // status strip (both faces, always)
  document.querySelectorAll('#viewNet .status button.st').forEach(b => {
    const key = b.dataset.face, ff = forward(key, state.W), lab = FACES[key].label;
    const fp = pctList(ff.p);
    const right = ff.pred === lab, sure = ff.p[lab] >= GOAL;
    b.setAttribute('aria-pressed', key === state.face);
    b.querySelector('.l1').textContent = `${t(TEST.includes(key) ? 'testFace' : 'face')}: ${t(OUT[lab])}`;
    b.querySelector('.l2').textContent = `${t('says')}: ${t(OUT[ff.pred])} ${fp[ff.pred]}`;
    const chip = b.querySelector('.chip'), st = !right ? 'bad' : (sure ? 'ok' : 'mid');
    chip.className = 'chip ' + st; chip.textContent = t(st);
    b.dataset.state = st;
  });
  const L = loss(state.W), done = solved(state.W);
  $('#lossVal').textContent = fmt(L);
  $('#lossBar').style.width = Math.min(100, L / 1.5 * 100) + '%';
  $('#lossBox').classList.toggle('done', done);
  $('#goalText').textContent = t(done ? 'done' : 'goal');
  if (done !== render.wasDone) { render.wasDone = done; if (done) $('#live').textContent = t('done'); }

  // toolbar
  document.querySelectorAll('#faceSeg button').forEach(b => {
    b.classList.toggle('active', b.dataset.face === state.face);
    b.setAttribute('aria-pressed', b.dataset.face === state.face);
  });
  const trainBtn = $('#trainBtn');
  trainBtn.textContent = t(state.training ? 'stop' : 'train');
  trainBtn.className = (state.touchedNet || state.training) ? 'edu-btn' : 'btn-ghost';
  $('#lossLabel').textContent = t('loss') + (state.steps ? ` · ${t('step')} ${state.steps}` : '');
  $('#testRow').hidden = !state.showTest;

  document.querySelectorAll('.hints').forEach(h => { h.hidden = !state.hints; });

  renderLm();

  // view
  document.title = t(state.view === 'lm' ? 'lmDocTitle' : 'docTitle');
  document.querySelectorAll('[data-view-panel]').forEach(p => { p.hidden = p.dataset.viewPanel !== state.view; });
  document.querySelectorAll('[data-view]').forEach(b => {
    b.classList.toggle('active', b.dataset.view === state.view);
    b.setAttribute('aria-selected', b.dataset.view === state.view);
  });
}
function renderLm() {
  const lm = state.lm, gen = lm.genCtx !== null;
  const tokIdx = LM_PAIR_POS[lm.pos];
  const ctx = gen ? lm.genCtx : LM_TEXT[tokIdx], target = gen ? null : LM_TEXT[tokIdx + 1];
  const p = lmProbs(lm.W, ctx);

  // text
  lmRefs.toks.forEach((tok, i) => {
    const isEnd = i % LM_SENT_LEN === LM_SENT_LEN - 1;
    const isCtx = !gen && i === tokIdx, isTgt = !gen && i === tokIdx + 1;
    tok.setAttribute('class', 'tok' + (isEnd ? ' last' : '') + (isCtx ? ' ctx' : '') + (isTgt ? ' tgt' : ''));
    if (tok.fit) {
      const pt = lmProbs(lm.W, LM_TEXT[i - 1])[LM_TEXT[i]];
      tok.fit.setAttribute('width', tok.fitW * pt);
      tok.fit.setAttribute('class', 'fit ' + (pt < LM_BAD ? 'bad' : (pt < LM_OK ? 'mid' : 'ok')));
    }
    if (tok.hasAttribute('role')) {
      tok.setAttribute('aria-pressed', isCtx);
      tok.setAttribute('aria-label', t('lmTokLabel', { i: i + 1, of: LM_TEXT.length, w: lmWord(LM_TEXT[i]) }));
    }
  });

  // input word, one-hot
  lmRefs.word.textContent = lmWord(ctx);
  lmRefs.tokId.textContent = t('lmToken', { id: ctx });
  for (let k = 0; k < LM_V; k++) {
    lmRefs.oh[k].setAttribute('class', 'oh' + (k === ctx ? ' on' : ''));
    lmRefs.ohn[k].setAttribute('class', 'ohn' + (k === ctx ? ' on' : ''));
    lmRefs.ohn[k].textContent = k === ctx ? '1' : '0';
  }

  // knobs, edges, rows
  const lmPcts = pctList(p, true);
  for (let k = 0; k < LM_V; k++) {
    const w = lm.W[ctx][k], sc = signClass(w), r = lmRefs.rows[k];
    lmRefs.edges[k].setAttribute('class', 'edge ' + sc);
    lmRefs.edges[k].setAttribute('stroke-width', sc === 'zero' ? 1.5 : 1.5 + Math.abs(w) * 1.6);
    drawKnob(lmRefs.knobs[k], w, LM_W_MAX, LG.knob.r, 1);
    lmRefs.knobs[k].g.setAttribute('aria-label', t('lmKnob', { c: lmWord(ctx), n: lmWord(k) }));
    r.word.textContent = lmWord(k);
    r.prob.textContent = lmPcts[k];
    r.bar.setAttribute('width', Math.max(0, LG.bar.w * p[k]));
    r.tag.textContent = k === target ? t('lmTag') : '';
    r.g.setAttribute('class', 'row' + (k === target ? ' tgt' : '') + (gen && k === lm.genPick ? ' pick' : ''));
  }

  // status: the selected pair
  const pair = $('#lmPairBox'), chip = pair.querySelector('.chip');
  if (gen) {
    pair.querySelector('.l1').textContent = t('lmGenPair', { n: lm.genIdx + 1, of: LM_GEN_COUNT, c: lmWord(ctx) });
    pair.querySelector('.l2').textContent = t('lmGenPick', { n: lmWord(lm.genPick), p: lmPcts[lm.genPick] });
    chip.hidden = true;
  } else {
    const st = p[target] < LM_BAD ? 'bad' : (p[target] < LM_OK ? 'mid' : 'ok');
    pair.querySelector('.l1').textContent = t('lmPair', { c: lmWord(ctx), n: lmWord(target) });
    pair.querySelector('.l2').textContent = t('lmGives', { p: lmPcts[target] });
    chip.hidden = false; chip.className = 'chip ' + st; chip.textContent = t(st);
    pair.dataset.state = st;
  }

  // status: loss + 3 generated sentences
  const L = lmLoss(lm.W), done = L < LM_GOAL, trained = L < 1.25;
  const glist = $('#lmGenList'), gnote = $('#lmGenNote');
  glist.innerHTML = '';
  gnote.textContent = '';
  if (!lm.gens || !lm.gens.length) {
    const empty = document.createElement('div');
    empty.className = 'l2 gen';
    empty.textContent = t('lmGenEmpty');
    glist.appendChild(empty);
  } else {
    lm.gens.forEach((seq, idx) => {
      const row = document.createElement('div');
      const isActive = !lm.genDone && idx === lm.genIdx;
      row.className = 'gen-item' + (isActive ? ' active' : '');
      const span = document.createElement('span');
      span.textContent = `${idx + 1}. ${lmSentence(seq)}`;
      row.appendChild(span);
      if (seq.length >= LM_SENT_LEN) {
        const badge = document.createElement('span');
        const kind = lmSentKind(seq, trained);
        badge.className = 'chip ' + { untrain: 'untrain', text: 'mid', new: 'info', slip: 'bad' }[kind];
        badge.textContent = t({ untrain: 'lmUntrained', text: 'lmInText', new: 'lmNew', slip: 'lmSlip' }[kind]);
        row.dataset.kind = kind;
        row.appendChild(badge);
      }
      glist.appendChild(row);
    });
    if (lm.genDone) {
      const fresh = trained && lm.gens.find(q => lmSentKind(q, trained) === 'new');
      gnote.textContent = t(trained ? 'lmNoteNew' : 'lmNoteUntrained') + (fresh ? ' ' + t('lmNoteWhy', {
        s: lmSentence(fresh), a: lmSentence(fresh.slice(0, 2)), b: lmSentence(fresh.slice(1, 3)) }) : '');
    }
  }

  $('#lmLossVal').textContent = fmt(L);
  $('#lmLossBar').style.width = Math.min(100, L / 2.0 * 100) + '%';
  $('#lmLossBox').classList.toggle('done', done);
  $('#lmGoalText').textContent = done ? t('lmDone') : t('lmGoal', { c: lmWord(0), a: lmWord(2), b: lmWord(3) });
  if (done !== renderLm.wasDone) { renderLm.wasDone = done; if (done) $('#live').textContent = t('lmDone'); }
  $('#lmLossLabel').textContent = t('lmLoss') + (lm.steps ? ` · ${t('step')} ${lm.steps}` : '');
  const lmTrainBtn = $('#lmTrainBtn');
  lmTrainBtn.textContent = t(lm.training ? 'stop' : 'train');
  lmTrainBtn.className = (lm.touched || lm.training) ? 'edu-btn' : 'btn-ghost';

  // DOM contract
  const card = $('#lmCard');
  card.dataset.ctx = ctx; card.dataset.target = target === null ? '' : target;
  card.dataset.loss = L.toFixed(4); card.dataset.steps = lm.steps; card.dataset.training = lm.training;
  card.dataset.gen = lm.gens ? lm.gens.map(s => s.join(' ')).join(' | ') : ''; card.dataset.genDone = lm.genDone;
  card.dataset.fit = LM_PAIR_POS.map(i => lmProbs(lm.W, LM_TEXT[i])[LM_TEXT[i + 1]].toFixed(3)).join(' ');
}

// ─── Actions ───
function setWeight(i, k, v) { stopTraining(); state.touchedNet = true; state.W[i][k] = clamp(snap(v)); state.steps = 0; render(); }
function setWeights(W) { stopTraining(); state.W = W.map(r => r.map(clamp)); state.steps = 0; render(); }
function stopTraining() { if (state.training) { state.training = false; cancelAnimationFrame(state.raf); } }
function trainTick() {
  if (!state.training) return;
  state.W = gradStep(state.W, LR); state.steps++;
  const goalMet = TRAIN.every(k => forward(k, state.W).p[FACES[k].label] >= STOP_AT);
  if (goalMet || state.steps >= MAX_STEPS) state.training = false;
  else state.raf = requestAnimationFrame(trainTick);
  render();
}
function toggleTraining() {
  if (state.training) { stopTraining(); render(); return; }

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    while (state.training) {
      state.W = gradStep(state.W, LR); state.steps++;
      if (TRAIN.every(k => forward(k, state.W).p[FACES[k].label] >= STOP_AT) || state.steps >= MAX_STEPS) state.training = false;
    }
    render();
  } else trainTick();
}

function lmStopTraining() { const lm = state.lm; if (lm.training) { lm.training = false; cancelAnimationFrame(lm.raf); } }
function lmStopGen() { const lm = state.lm; clearTimeout(lm.genTimer); lm.genCtx = null; lm.genPick = null; if (lm.gens) lm.genDone = true; }
function lmSetWeight(c, k, v) { lmStopTraining(); state.lm.touched = true; state.lm.W[c][k] = lmClamp(snap(v)); state.lm.steps = 0; render(); }
function lmSetWeights(W) { lmStopTraining(); lmStopGen(); state.lm.gens = null; state.lm.genDone = false; state.lm.W = W.map(r => r.map(lmClamp)); state.lm.steps = 0; render(); }
function lmSetPos(i) { lmStopGen(); state.lm.pos = (i + LM_PAIRS) % LM_PAIRS; render(); }
function lmTrainOnce() {
  const lm = state.lm;
  lm.W = lmGradStep(lm.W, LM_LR); lm.steps++;
  if (lmLoss(lm.W) <= LM_STOP_AT || lm.steps >= LM_MAX_STEPS) lm.training = false;
}
function lmTrainTick() {
  if (!state.lm.training) return;
  lmTrainOnce();
  if (state.lm.training) state.lm.raf = requestAnimationFrame(lmTrainTick);
  render();
}
function lmToggleTraining() {
  const lm = state.lm;
  if (lm.training) { lmStopTraining(); render(); return; }
  lmStopGen(); lm.gens = null; lm.genDone = false;
  lm.training = true; lm.steps = 0;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { while (lm.training) lmTrainOnce(); render(); }
  else lmTrainTick();
}
// Generate 3 sentences sequentially (showing randomness in AI chat sampling with identical weights)
function lmGenStartWord() {
  const lm = state.lm;
  return LM_STARTS[Math.floor(lm.rng() * LM_STARTS.length) % LM_STARTS.length];
}
function lmGenStep() {
  const lm = state.lm;
  let seq = lm.gens[lm.genIdx];
  if (seq.length >= LM_SENT_LEN) {
    lm.genIdx++;
    seq = [lmGenStartWord()];
    lm.gens.push(seq);
  }
  const ctx = seq[seq.length - 1];
  const next = lmSample(lmProbs(lm.W, ctx), lm.rng, LM_TOP_P);
  seq.push(next);
  lm.genCtx = ctx;
  lm.genPick = next;
  if (seq.length >= LM_SENT_LEN && lm.genIdx + 1 >= LM_GEN_COUNT) {
    lm.genDone = true;
  }
}
function lmGenerate() {
  const lm = state.lm;
  lmStopTraining(); clearTimeout(lm.genTimer);
  lm.gens = [[lmGenStartWord()]];
  lm.genIdx = 0;
  lm.genDone = false;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    while (!lm.genDone) lmGenStep();
    lm.genCtx = null; lm.genPick = null; render(); return;
  }
  const tick = () => {
    lmGenStep();
    render();
    if (!lm.genDone) lm.genTimer = setTimeout(tick, LM_GEN_MS);
  };
  tick();
}
function setView(v) {
  if (v === state.view) return;
  stopTraining(); lmStopTraining(); lmStopGen();
  state.view = v;
  $('#live').textContent = '';
  window.scrollTo({ top: 0 });
  try { history.replaceState(null, '', v === 'lm' ? '#llm' : location.pathname + location.search); } catch (e) { /* file:// */ }
  render();
}

// ─── Listeners ───
function bind() {
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
    state.lang = b.dataset.lang; store.set('nn-lang', state.lang); applyLang();
  }));
  const toggleHints = (force) => {
    state.hints = typeof force === 'boolean' ? force : !state.hints;
    store.set('nn-hints', state.hints ? '1' : '0');
    render();
  };
  $('#hintsBtn').addEventListener('click', () => toggleHints());
  document.querySelectorAll('[data-close-hints]').forEach(b => b.addEventListener('click', () => toggleHints(false)));
  document.querySelectorAll('[data-face]').forEach(b => b.addEventListener('click', () => { state.face = b.dataset.face; render(); }));
  $('#resetBtn').addEventListener('click', () => { state.touchedNet = false; setWeights(START_W); });
  $('#randomBtn').addEventListener('click', () => { state.touchedNet = true; setWeights(START_W.map(r => r.map(() => snap(Math.random() * 4 - 2)))); });
  $('#trainBtn').addEventListener('click', () => { state.touchedNet = true; toggleTraining(); });
  $('#testBtn').addEventListener('click', () => {
    state.showTest = !state.showTest;
    if (!state.showTest && TEST.includes(state.face)) state.face = 'boy';
    render();
    if (state.showTest) requestAnimationFrame(() => $('#testRow').scrollIntoView({ behavior: 'smooth', block: 'nearest' }));
  });

  // Mobile horizontal scroll cue + edge shadow state
  [['#netGraphWrap', '#netGraphShell', '#netScrollHint'], ['#lmGraphWrap', '#lmGraphShell', '#lmScrollHint']].forEach(([wSel, sSel, hSel]) => {
    const wrap = $(wSel), shell = $(sSel), hint = $(hSel);
    const updateScroll = () => {
      const canRight = wrap.scrollLeft + wrap.clientWidth < wrap.scrollWidth - 4;
      shell.classList.toggle('can-scroll-right', canRight);
      if (wrap.scrollLeft > 24) hint.classList.add('seen');
    };
    wrap.addEventListener('scroll', updateScroll, { passive: true });
    addEventListener('resize', updateScroll, { passive: true });
    requestAnimationFrame(updateScroll);
  });

  refs.hid.forEach((g, i) => {
    g.addEventListener('pointerenter', () => { state.focusHidden = i; render(); });
    g.addEventListener('pointerleave', () => { state.focusHidden = null; render(); });
    g.addEventListener('focus', () => { state.focusHidden = i; render(); });
    g.addEventListener('blur', () => { state.focusHidden = null; render(); });
    const pin = () => { state.pinnedHidden = state.pinnedHidden === i ? null : i; render(); };
    g.addEventListener('click', pin);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pin(); } });
  });

  refs.knobs.forEach((row, i) => row.forEach((kn, k) => bindKnob(
    kn.g, W_MAX, () => state.W[i][k], v => setWeight(i, k, v),
    on => {
      if (on) state.focusKnob = { i, k };
      else if (state.focusKnob && state.focusKnob.i === i && state.focusKnob.k === k) state.focusKnob = null;
      render();
    }
  )));

  // LLM tab
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
  addEventListener('hashchange', () => setView(location.hash === '#llm' ? 'lm' : 'net'));
  const lmCtx = () => state.lm.genCtx !== null ? state.lm.genCtx : LM_TEXT[LM_PAIR_POS[state.lm.pos]];
  lmRefs.knobs.forEach((kn, k) => bindKnob(kn.g, LM_W_MAX, () => state.lm.W[lmCtx()][k], v => lmSetWeight(lmCtx(), k, v)));
  const pickTok = e => {
    const tok = e.target.closest('.tok[role]');
    if (!tok) return;
    if (e.type === 'keydown') { if (e.key !== 'Enter' && e.key !== ' ') return; e.preventDefault(); }
    const pairIdx = +tok.dataset.pair;
    lmSetPos(pairIdx);
    lmRefs.toks[+tok.dataset.pos].focus({ preventScroll: true });
  };
  lmRefs.textG.addEventListener('click', pickTok);
  lmRefs.textG.addEventListener('keydown', pickTok);
  $('#lmPrev').addEventListener('click', () => lmSetPos(state.lm.pos - 1));
  $('#lmNext').addEventListener('click', () => lmSetPos(state.lm.pos + 1));
  $('#lmGenBtn').addEventListener('click', lmGenerate);
  $('#lmResetBtn').addEventListener('click', () => {
    state.lm.touched = false;
    lmSetWeights(lmSmallRandom());
  });
  $('#lmRandomBtn').addEventListener('click', () => { state.lm.touched = true; lmSetWeights(lmZeros().map(r => r.map(() => snap(Math.random() * 4 - 2)))); });
  $('#lmTrainBtn').addEventListener('click', () => { state.lm.touched = true; lmToggleTraining(); });

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Escape' && state.hints) { toggleHints(false); return; }
    if (e.key === 'h' || e.key === 'H') { $('#hintsBtn').click(); return; }
    if (state.view === 'lm') {
      if (e.key === 'ArrowLeft') { e.preventDefault(); lmSetPos(state.lm.pos - 1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); lmSetPos(state.lm.pos + 1); }
      else if (e.key === 'g' || e.key === 'G') lmGenerate();
      return;
    }
    if (e.key === '1') { state.face = 'boy'; render(); }
    else if (e.key === '2') { state.face = 'girl'; render(); }
    else if ((e.key === '3' || e.key === '4') && state.showTest) { state.face = TEST[+e.key - 3]; render(); }
  });
}

// ─── Init ───
buildGraph();
buildLmGraph();
layoutLmText();
bind();
applyLang();
window.__nn = { FACES, TRAIN, TEST, HIDDEN, OUT, GOAL, START_W, state, forward, loss, gradStep, solved, setWeights,
  lm: { VOCAB: LM_VOCAB, TEXT: LM_TEXT, PAIR_POS: LM_PAIR_POS, GOAL: LM_GOAL, probs: lmProbs, loss: lmLoss, gradStep: lmGradStep,
        inText: lmInText, sentKind: lmSentKind, setWeights: lmSetWeights, setPos: lmSetPos, generate: lmGenerate, setView } };

// ─── Reveal ───
const FONT_WAIT_MS = 1500;
const BRAND_FONTS = ['400 1em Outfit', '700 1em Outfit', '400 1em "IBM Plex Sans"', '600 1em "IBM Plex Sans"', '400 1em "Roboto Mono"'];
Promise.race([
  Promise.all(BRAND_FONTS.map(f => document.fonts.load(f).catch(() => null))),
  new Promise(r => setTimeout(r, FONT_WAIT_MS)),
]).then(() => document.documentElement.classList.add('app-ready'));
</script>
</body>
